<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link href="https://raw.githubusercontent.com/nokiapro/xuankenofficial/main/icon.png" rel="shortcut icon" type="image/x-icon" />
    <title>XuanKen Music Official</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="https://kit-pro.fontawesome.com/releases/v7.2.0/css/pro.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-database-compat.js"></script>
    <script src="js/firebase-config.js"></script>
</head>
<body>

    <div id="toast-msg"></div>
    <div id="custom-notification" class="notification">
        <div class="notification-icon">
            <i data-lucide="headphones"></i>
        </div>
        <div class="notification-content">
            <div class="notification-title"></div>
            <div class="notification-message"></div>
        </div>
    </div>

    <div id="interaction-hint">
        <div class="hint-logo">
            <img src="https://raw.githubusercontent.com/nokiapro/xuankenofficial/main/logoofficial.png" alt="Logo Xuanken Music">
        </div>
        <div class="hint-title">XUANKEN MUSIC</div>
        <div class="hint-subtitle">OFFICIAL</div>
        <form id="username-form" class="username-form" autocomplete="username">
            <label class="username-label" for="username-input">NHẬP USERNAME</label>
            <input type="text" id="username-input" class="username-input" placeholder="Tên của bạn..." maxlength="20" required>
            <div id="username-error" class="username-error" style="display:none;"></div>
            <button type="submit" id="username-start-btn" class="username-start-btn">
                <i data-lucide="play"></i>
                <span>BẮT ĐẦU</span>
            </button>
        </form>
        <div class="hint-decoration">
            <i data-lucide="heart"></i> DESIGNER BY XUANKEN OFFICIAL <i data-lucide="heart"></i>
        </div>
        <a href="admin.html" class="admin-link-hint" onclick="event.stopPropagation()">Admin</a>
    </div>

    <div class="player-container" id="player-container" style="display: none;">
        <div class="header-section">
            <div class="top-left-action">
                <div class="btn-icon" id="open-timer-btn" title="Hẹn giờ tắt">
                    <i data-lucide="timer"></i>
                </div>
                <div class="btn-icon" id="listen-count-btn" title="Lượt nghe">
                    <i data-lucide="headphones"></i>
                </div>
            </div>

            <div class="top-right-action">
                <div class="btn-icon" id="theme-toggle" title="Chế độ sáng/tối">
                    <i data-lucide="sun" id="theme-icon"></i>
                </div>
                <div class="top-right-stack">
                    <div class="btn-icon" id="list-btn" title="Danh sách bài hát">
                        <i data-lucide="list-music"></i>
                    </div>
                    <div class="btn-icon" id="shop-btn" title="Cửa hàng XK">
                        <i data-lucide="store"></i>
                    </div>
                </div>
            </div>
            
            <div class="user-badge" id="user-badge" style="display:none;">
                <i data-lucide="user"></i>
                <span id="user-badge-name"></span>
                <span class="user-badge-sep">·</span>
                <i class="fa-solid fa-coins"></i>
                <span id="user-badge-coins">0</span>
            </div>
            <div class="album-art">
                <img id="current-art" src="https://raw.githubusercontent.com/nokiapro/xuankenofficial/main/logoofficial.png" alt="Art">
            </div>
            <div class="song-info-main">
                <span class="song-title" id="current-title">Sẵn sàng</span>
                <span class="artist-name" id="current-artist">XuanKen Official</span>
                <div class="lyric-container" id="lyric-container">
                    <div class="current-lyric" id="lyric-text"><i data-lucide="smile"></i> Chọn bài hát để phát <i data-lucide="smile"></i></div>
                </div>
            </div>
        </div>

        <div class="controls-bar">
            <div class="progress-wrapper">
                <div class="progress-bar-container" id="progress-area">
                    <div class="progress-filled" id="progress-fill"></div>
                    <div class="progress-thumb" id="progress-thumb"></div>
                </div>
                <div class="time-info">
                    <span id="time-current">00:00</span>
                    <span id="time-total">00:00</span>
                </div>
            </div>

            <div class="main-actions">
                <div class="btn-icon" id="shuffle-btn" title="Phát ngẫu nhiên">
                    <i data-lucide="shuffle"></i>
                </div>
                <div class="btn-icon" id="prev-btn" title="Bài trước">
                    <i data-lucide="skip-back"></i>
                </div>
                <div class="btn-icon play-btn" id="play-pause-btn" title="Phát / Tạm dừng">
                    <i data-lucide="play" id="play-icon"></i>
                </div>
                <div class="btn-icon" id="next-btn" title="Bài tiếp">
                    <i data-lucide="skip-forward"></i>
                </div>
                <div class="btn-icon" id="repeat-btn" title="Lặp lại">
                    <i data-lucide="repeat"></i>
                </div>
            </div>
        </div>

        <div class="playlist" id="playlist">
            <div class="playlist-header" id="playlist-header">
                <div class="close-playlist" id="close-playlist-btn">
                    <i data-lucide="x"></i>
                </div>
                <div class="playlist-title"><i data-lucide="music"></i> DANH SÁCH BÀI HÁT <i data-lucide="music"></i></div>
                <div style="width: 40px;"></div> 
            </div>
            <div id="playlist-content"></div>
        </div>

        <div id="timer-overlay" class="timer-overlay"></div>
        <div id="timer-modal" class="timer-modal">
            <div class="timer-modal-header">
                <div class="close-timer" id="close-timer-modal">
                    <i data-lucide="x"></i>
                </div>
                <div class="timer-title"><i data-lucide="timer"></i> HẸN GIỜ TẮT NHẠC <i data-lucide="timer"></i></div>
                <div style="width: 40px;"></div>
            </div>
            <div class="timer-modal-content">
                <div class="timer-status-box">
                    <i data-lucide="alarm-clock"></i>
                    <div class="timer-status-text" id="timer-status">CHƯA ĐẶT HẸN GIỜ</div>
                </div>
                
                <div class="timer-preset-group">
                    <button class="timer-preset" data-minutes="15">15</button>
                    <button class="timer-preset" data-minutes="30">30</button>
                    <button class="timer-preset" data-minutes="60">60</button>
                    <button class="timer-preset" data-minutes="90">90</button>
                    <button class="timer-preset" data-minutes="120">120</button>
                </div>
                
                <input type="number" id="timer-minutes" class="timer-input" placeholder="NHẬP SỐ PHÚT...">
                
                <button id="start-timer-btn" class="timer-start-btn">
                    <i data-lucide="play"></i> BẮT ĐẦU
                </button>
                
                <button id="cancel-timer-btn" class="timer-cancel-btn">
                    <i data-lucide="trash-2"></i> HỦY HẸN GIỜ
                </button>
            </div>
        </div>

        <!-- Cửa hàng XK -->
        <div id="shop-modal" class="shop-modal">
            <div class="shop-modal-header">
                <div class="close-shop" id="close-shop-btn">
                    <i data-lucide="x"></i>
                </div>
                <div class="shop-title"><i data-lucide="store"></i> CỬA HÀNG XK</div>
                <div style="width:40px;"></div>
            </div>
            <div class="shop-balance-bar">
                <div class="shop-coins">
                    <i class="fa-solid fa-coins"></i>
                    <span id="shop-coin-count">0</span> XK
                </div>
                <button type="button" id="checkin-btn" class="checkin-btn">
                    <i data-lucide="calendar-check"></i>
                    <span id="checkin-btn-text">ĐIỂM DANH</span>
                </button>
            </div>
            <div class="shop-hint" id="shop-hint">Chưa sở hữu bài → chỉ nghe demo 30 giây. Điểm danh mỗi ngày nhận xu XK để mua nhạc.</div>
            <div class="shop-list" id="shop-list"></div>
        </div>
    </div>

    <audio id="audio-player" preload="auto" crossorigin="anonymous" playsinline></audio>

    <script src="js/music.js"></script>
    <script>
        // Khởi tạo Lucide icons
        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }
    </script>
</body>
</html>
