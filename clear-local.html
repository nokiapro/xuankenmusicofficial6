<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Xóa localStorage — XuanKen Music</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0b0b12; color: #eee; padding: 24px;
    }
    .box {
      max-width: 440px; width: 100%; background: #161622; border: 1px solid rgba(255,68,68,0.35);
      border-radius: 16px; padding: 28px 24px; box-shadow: 0 12px 40px rgba(0,0,0,0.45);
    }
    h1 { margin: 0 0 8px; font-size: 1.25rem; color: #ff6b6b; }
    p { margin: 0 0 14px; font-size: 0.9rem; line-height: 1.5; color: #aaa; }
    button {
      width: 100%; border: none; border-radius: 10px; padding: 14px 16px; font-size: 1rem;
      font-weight: 600; cursor: pointer; background: linear-gradient(135deg, #ff0040, #8c00ff);
      color: #fff; margin-top: 8px;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary {
      background: transparent; border: 1px solid rgba(255,255,255,0.2); color: #ccc; margin-top: 10px;
    }
    pre {
      margin-top: 16px; font-size: 0.75rem; background: #0b0b12; border-radius: 8px;
      padding: 12px; max-height: 220px; overflow: auto; white-space: pre-wrap; display: none;
      color: #9f9;
    }
    .ok { color: #4ade80; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Xóa cache local (PC / Mobile)</h1>
    <p>
      Trang này xóa <strong>localStorage</strong> của XuanKen Music trên <em>trình duyệt hiện tại</em>
      (xu, tài khoản, PIN trust, theme…). Chạy trên <strong>cả PC và điện thoại</strong> sau khi reset Firebase.
    </p>
    <p style="color:#ff9800;font-size:0.82rem;">
      Không xóa dữ liệu trên Firebase. Chỉ xóa dữ liệu lưu trong máy bạn.
    </p>
    <button id="clear-btn" type="button">XÓA TOÀN BỘ LOCALSTORAGE SITE NÀY</button>
    <button id="back-btn" class="btn-secondary" type="button">Về trang chủ</button>
    <pre id="log"></pre>
  </div>
  <script>
    (function () {
      var btn = document.getElementById('clear-btn');
      var logEl = document.getElementById('log');
      var back = document.getElementById('back-btn');
      back.onclick = function () { location.href = 'index.html'; };

      btn.onclick = function () {
        if (!confirm('Xóa toàn bộ localStorage của site này trên máy/trình duyệt hiện tại?')) return;
        var keys = [];
        try {
          for (var i = 0; i < localStorage.length; i++) {
            keys.push(localStorage.key(i));
          }
        } catch (e) {}

        // Xóa mọi key liên quan xuanken / music6 / prefix site
        var removed = [];
        var patterns = [
          /^music6_/i,
          /^xuanken/i,
          /xuanken/i,
          /_accounts$/i,
          /_current_user$/i,
          /admin_settings/i,
          /song_prices/i,
          /pin_trust/i,
          /listens/i,
          /theme/i,
          /profiles/i
        ];

        // Factory reset local: xóa toàn bộ localStorage origin này
        keys.forEach(function (k) {
          if (!k) return;
          try {
            localStorage.removeItem(k);
            removed.push(k);
          } catch (e) {}
        });

        // sessionStorage cũng xóa
        try { sessionStorage.clear(); } catch (e) {}

        logEl.style.display = 'block';
        logEl.innerHTML = '<span class="ok">Đã xóa ' + removed.length + ' key localStorage</span>\n' +
          removed.map(function (k) { return '· ' + k; }).join('\n') +
          '\n\n<span class="ok">Xong. Hãy hard-refresh trang chủ (Ctrl+F5) hoặc đóng tab rồi mở lại.</span>';
        btn.disabled = true;
        btn.textContent = 'Đã xóa xong';
      };
    })();
  </script>
</body>
</html>
